name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Project Pages is published from the gh-pages branch (legacy). The official
# actions/deploy-pages flow cannot create the Pages site with this token;
# pushing the branch does, and GitHub builds it automatically.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/client
          force_orphan: true
          enable_jekyll: false
          exclude_assets: "__grok,_shell.html"
